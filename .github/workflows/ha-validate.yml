name: Validate Home Assistant wrapper
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/home-assistant/requirements-ci.txt
      - run: python -m unittest discover -s deploy/home-assistant/tests -v
      - run: python -m compileall -q deploy/home-assistant
